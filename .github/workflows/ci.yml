name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    uses: MauroDruwel/quality-gate/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.12'
      run-tests: true
      run-lint: true
      run-format: true
      strict: true
