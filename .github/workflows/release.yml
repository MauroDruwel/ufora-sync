name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tauri-release:
    uses: MauroDruwel/quality-gate/.github/workflows/tauri-release.yml@main
    with:
      release-tag: ${{ github.event.inputs.release-tag || github.ref_name }}
      package-manager: "pnpm"
      pnpm-version: "10"
