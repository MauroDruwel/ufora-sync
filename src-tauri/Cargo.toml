[package]
name = "ufora-sync"
version = "1.0.8"
description = "Native background sync service and desktop companion for UGent Ufora"
authors = ["Mauro Druwel"]
edition = "2021"
rust-version = "1.80"
license = "MIT"
default-run = "ufora-sync"

[lib]
name = "ufora_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ufora-sync"
path = "src/main.rs"

[[bin]]
name = "sandbox_sync"
path = "src/bin/sandbox_sync.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
regex = "1"
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
